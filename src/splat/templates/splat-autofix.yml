name: Splat Auto-Fix

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: autofix-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check trigger conditions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          HAS_MENTION: ${{ contains(github.event.comment.body, '@claude') }}
        run: |
          if [[ "$EVENT" == "issues" && "$ACTION" == "labeled" ]]; then
            if [[ "$LABEL" == "auto-fix" ]]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "$EVENT" == "issues" && "$ACTION" == "opened" ]]; then
            REPO="${{ github.repository }}"
            ISSUE="${{ github.event.issue.number }}"
            LABELS=$(gh api "repos/$REPO/issues/$ISSUE" --jq '.labels[].name' || true)
            if echo "$LABELS" | grep -q '^auto-fix$'; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "$EVENT" == "issue_comment" && "$IS_PR" != "true" ]]; then
            if [[ "$HAS_MENTION" == "true" ]]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  autofix:
    needs: [check-label]
    if: needs.check-label.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 100
            --dangerously-skip-permissions
          show_full_output: true
          prompt: |
            You are fixing a bug reported in this GitHub issue.

            ## Systematic Debugging Process

            BEFORE attempting ANY fix, complete these phases:

            ### Phase 1: Root Cause Investigation
            1. Read error messages completely - stack traces, line numbers, error codes
            2. Reproduce the issue - understand exact steps to trigger
            3. Check recent changes - git diff, recent commits, config changes
            4. Trace data flow - where does the bad value originate?

            ### Phase 2: Pattern Analysis
            1. Find working examples in the codebase
            2. Compare against references - read completely, don't skim
            3. Identify differences between working and broken

            ### Phase 3: Hypothesis Testing
            1. Form single hypothesis: "X is root cause because Y"
            2. Make SMALLEST possible change to test
            3. One variable at a time - don't fix multiple things at once

            ### Phase 4: Implementation
            1. Create failing test case FIRST (if test infrastructure exists)
            2. Implement single fix addressing root cause
            3. Verify fix - test passes, no regressions
            4. If 3+ fixes fail, STOP - this indicates architectural problem

            ## Rules
            - NO FIXES WITHOUT ROOT CAUSE INVESTIGATION
            - Never guess - if you don't understand, investigate more
            - Symptom fixes are failure - fix the source
            - Verify your fix works before claiming success
            - Create a PR with your changes when complete

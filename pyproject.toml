[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-splat"
version = "0.2.2"
description = "Automatic GitHub issue creation + PR fix on runtime errors"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Andreas Lordos" }
]
keywords = [
    "error-tracking",
    "crash-reporting",
    "github-issues",
    "debugging",
    "monitoring",
    "flask",
    "fastapi",
    "exception-handling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
    "Environment :: Web Environment",
]

dependencies = [
    "httpx>=0.25.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "click>=8.0.0",
    "questionary>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/andreaslordos/splat"
Repository = "https://github.com/andreaslordos/splat"
Issues = "https://github.com/andreaslordos/splat/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "respx>=0.20.0",
    "black",
    "ruff",
    "mypy",
    "pre-commit>=3.0.0",
    "types-PyYAML",
    "flask>=2.0.0",
    "fastapi>=0.100.0",
]

[project.scripts]
splat = "splat.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/splat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
disable_error_code = ["method-assign"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.coverage.run]
source = ["splat"]
omit = ["*/tests/*", "*/cli/init.py"]

[tool.coverage.report]
fail_under = 80

[tool.splat]
repo = "andreaslordos/splat"
labels = ["bug", "splat", "auto-fix"]

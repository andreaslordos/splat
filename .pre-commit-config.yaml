repos:
  # Universal hooks - file hygiene and safety
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python formatting (runs first, auto-fixes)
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3

  # Python linting (runs after black, auto-fixes where possible)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-r, src/splat]
        pass_filenames: false

  # Type checking (strict mode, configured in pyproject.toml)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          - httpx>=0.25.0
          - click>=8.0.0
          - flask>=2.0.0
          - fastapi>=0.100.0
          - types-PyYAML

  # Tests with coverage (must pass 80% threshold)
  - repo: local
    hooks:
      - id: pytest-with-coverage
        name: pytest with coverage (>=80%)
        entry: venv/bin/pytest --cov=src/splat --cov-report=term-missing --cov-fail-under=80
        language: system
        pass_filenames: false
        always_run: true
